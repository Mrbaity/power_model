name: Model Protection Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        # 支持 Linux, Windows, macOS (Intel)
        os: [ubuntu-latest, windows-latest, macos-13]
        
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        # 确保 requirements.txt 在根目录
        pip install -r requirements.txt

    - name: Compile lstm_model.py
      run: |
        # 使用 Nuitka 将其编译为模块 (.so 或 .pyd)
        python -m nuitka --module lstm_model.py --remove-output --no-docstrings

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-binaries-${{ matrix.os }}
        path: |
          *.so
          *.pyd
